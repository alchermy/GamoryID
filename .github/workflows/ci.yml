name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo_sqlite, gd, intl, zip
          coverage: none
      - name: Install dependencies
        working-directory: backend
        run: composer install --prefer-dist --no-progress
      - name: Prepare env
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Run tests
        working-directory: backend
        run: php artisan test

  merchant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: merchant/package-lock.json
      - working-directory: merchant
        run: npm ci
      - working-directory: merchant
        run: npm run lint
      - working-directory: merchant
        run: npm run build
      - working-directory: merchant
        run: npx vitest run

  public-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: public-web/package-lock.json
      - working-directory: public-web
        run: npm ci
      - working-directory: public-web
        run: npm run lint
      - working-directory: public-web
        run: npm run build
