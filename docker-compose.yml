# GamoryID production stack — single VPS, single environment (see the
# deploy runbook for why: budget-constrained 2GB box, dev stays local).
#
# Reads /opt/gamoryid/.env — the same file Laravel itself uses. Compose
# substitutes ${DB_*} below from that file automatically (it auto-loads a
# file named exactly ".env" next to this compose file); `env_file: .env` on
# app/worker/scheduler passes the *whole* file in as container env vars.
#
# Memory budget (2GB RAM + 2GB swap): db 350m, app 400m, worker 150m,
# scheduler 100m, web 100m — leaves headroom for the OS and traffic spikes.
# Tune the numbers below if `docker stats` shows a service consistently
# pinned at its limit.
#
# Each service lists both `image:` and `build:`. First deploy (Phase 4,
# before CI/CD exists): `docker compose build && docker compose up -d`
# builds locally and ignores IMAGE_TAG. Once deploy.yml exists: it sets
# IMAGE_TAG=<git sha> and runs `docker compose pull && up -d`, which just
# pulls that tag from GHCR instead of rebuilding on the VPS.

services:
  # mariadb, not mysql: the official mysql:8.0 image's recent builds require
  # the x86-64-v2 CPU baseline (SSE4.2 etc.) and hard-crash with "Fatal glibc
  # error: CPU does not support x86-64-v2" on this VPS's virtual CPU.
  # MariaDB speaks the same protocol Laravel's `mysql` driver expects, so
  # nothing else here (or in the app) needs to change.
  db:
    image: mariadb:10.11
    restart: unless-stopped
    command:
      - --innodb-buffer-pool-size=192M
      - --innodb-log-file-size=48M
      - --max-connections=50
      - --performance-schema=0
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
    mem_limit: 350m
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/alchermy/gamoryid-app:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
    volumes:
      - storage-data:/app/storage/app
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 400m
    # Overrides the FrankenPHP base image's built-in healthcheck, which
    # probes its admin API — disabled in our Caddyfile, so it always failed.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/up"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    image: ghcr.io/alchermy/gamoryid-app:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
    # Must name every queue in use — Discord shop notifications and all the
    # queued mail notifications dispatch onto "notifications", which a bare
    # `queue:work` (default queue only) would never pick up.
    command: php artisan queue:work --queue=default,notifications --tries=3 --max-time=3600 --sleep=3
    volumes:
      - storage-data:/app/storage/app
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 150m
    # A CLI worker never serves HTTP — the base image's HTTP healthcheck
    # doesn't apply here.
    healthcheck:
      disable: true

  scheduler:
    image: ghcr.io/alchermy/gamoryid-app:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
    # No cron daemon in the container — a plain loop calling schedule:run
    # every minute, which is what Laravel's own scheduler expects.
    command: >
      sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    volumes:
      - storage-data:/app/storage/app
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 100m
    healthcheck:
      disable: true

  web:
    image: ghcr.io/alchermy/gamoryid-web:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-thanawat.won01@gmail.com}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    mem_limit: 100m

volumes:
  db-data:
  storage-data:
  caddy-data:
  caddy-config:
